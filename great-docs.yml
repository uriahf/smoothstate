  pages: all
accent_color:
  light: "#1f5f82"
  dark: "#73c7e8"

logo_show_title: true
hero:
  name: "Smooth State"
  tagline: "Fast smoothing of state probabilities, built for Polars."
  logo_height: 180px
  badges:
