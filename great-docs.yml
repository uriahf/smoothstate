      img: https://img.shields.io/badge/python-%E2%89%A53.10-3776AB?logo=python&logoColor=white
      url: https://github.com/uriahf/smoothstate

nav_icons:
  navbar:
    User Guide: book-open
    API Reference: code-2
  sidebar:
    User Guide: book-open

source:
  enabled: true
  branch: main
  path: src/smoothstate
  placement: usage

changelog:
  enabled: false

