name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - run: uv run python benchmarks/diagnose_cox.py
      - run: uv run python benchmarks/benchmark_cox.py | tee benchmark-results.csv
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.csv

  r-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: uv run python benchmarks/export_r_validation.py

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::survival
            any::rms

      - name: Validate against survival and rms
        run: Rscript benchmarks/validate_r.R
