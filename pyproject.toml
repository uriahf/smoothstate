[project]
name = "smoothstate"
version = "0.1.0"
description = "Fast smoothing of state probabilities for Polars workflows"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["calibration", "cox", "polars", "restricted-cubic-spline", "survival-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "polars>=1.0",
]

[project.urls]
Documentation = "https://uriahf.github.io/smoothstate/"
Repository = "https://github.com/uriahf/smoothstate"
Issues = "https://github.com/uriahf/smoothstate/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "statsmodels>=0.14",
  "lifelines>=0.30",
  "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
